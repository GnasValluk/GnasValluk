<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90" role="img" aria-label="service.end then commits.start">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;white-space:pre}
    .cur{animation:b 1s steps(1) infinite}
    @keyframes b{50%{opacity:0}}
  </style>
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb000" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffb000"/>
      <stop offset="1" stop-color="#ffb000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="14" width="800" height="2" fill="url(#ln)"/>
  <text x="500" y="56" font-size="16" text-anchor="middle" fill="#8a9a5b">// service.end()  &#8594;  commits.start()</text>
  <text x="500" y="80" font-size="12" text-anchor="middle" fill="#5d6e58">thanks for stopping by</text>
  <rect class="cur" x="760" y="42" width="9" height="16" fill="#ffb000"/>
</svg>

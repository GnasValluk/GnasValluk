<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-label="ShieldGate USB Guard">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;white-space:pre}
    .glow{animation:g 3s ease-in-out infinite}
    @keyframes g{0%,100%{opacity:.55}50%{opacity:1}}
  </style>
  <rect width="1000" height="170" rx="14" fill="#0b0f0c"/>
  <rect x="0.5" y="0.5" width="999" height="169" rx="14" fill="none" stroke="#2a3a24"/>
  <g class="glow">
    <path d="M80 28 L124 44 V88 C124 114 104 130 80 142 C56 130 36 114 36 88 V44 Z" fill="#ffb000" fill-opacity="0.08" stroke="#ffb000" stroke-width="3" stroke-linejoin="round"/>
    <path d="M58 86 L74 102 L104 68" fill="none" stroke="#ffb000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="160" y="62" font-size="26" font-weight="700" fill="#ffb000">ShieldGate USB Guard</text>
  <text x="160" y="92" font-size="15" fill="#d7e0d0">Fights USB shortcut viruses, growing into broader port protection.</text>
  <g font-size="12" fill="#8fbf5a">
    <rect x="160" y="112" width="46" height="26" rx="13" fill="none" stroke="#3a4d30"/><text x="183" y="129" text-anchor="middle">USB</text>
    <rect x="214" y="112" width="82" height="26" rx="13" fill="none" stroke="#3a4d30"/><text x="255" y="129" text-anchor="middle">SECURITY</text>
    <rect x="304" y="112" width="134" height="26" rx="13" fill="none" stroke="#3a4d30"/><text x="371" y="129" text-anchor="middle">PORT PROTECTION</text>
  </g>
  <text x="960" y="92" font-size="14" text-anchor="end" fill="#ffb000" letter-spacing="2">VIEW REPO &#8594;</text>
</svg>
